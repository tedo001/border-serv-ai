[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ibvap"
version = "1.0.0"
description = "IBVAP - Intelligent Border Video Analytics Platform: software-defined AI surveillance for existing CCTV infrastructure"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "IBVAP Team" }]
keywords = ["video-analytics", "surveillance", "computer-vision", "anpr", "border-security"]
classifiers = [
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Image Recognition",
  "Operating System :: POSIX :: Linux",
]

dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "opencv-python-headless>=4.9",
  "onnxruntime>=1.17",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.7",
  "pydantic-settings>=2.2",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "aiosqlite>=0.20",
  "greenlet>=3.0",
  "pyjwt>=2.8",
  "bcrypt>=4.0",
  "python-multipart>=0.0.9",
  "prometheus-client>=0.20",
  "httpx>=0.27",
  "paho-mqtt>=2.1",
  "PyYAML>=6.0",
  "structlog>=24.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pytest-cov", "ruff", "mypy", "types-PyYAML"]
export = ["torch>=2.2", "ultralytics>=8.2", "onnx>=1.16", "onnxsim"]
gpu = ["onnxruntime-gpu>=1.17"]
desktop = ["PyQt6>=6.6"]
postgres = ["psycopg[binary]>=3.1"]

[project.scripts]
ibvap = "ibvap.cli:main"

[project.gui-scripts]
ibvap-console = "ibvap.desktop.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ibvap = ["ui/*.html", "ui/*.css", "ui/*.js", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Put the repository root on sys.path so `from tests.conftest import ...`
# resolves. Without this the suite only passes when pytest is invoked as
# `python -m pytest` (which adds the CWD implicitly) and fails under the
# `pytest` console script that CI uses - a difference that silently hid a
# collection error from every local run.
pythonpath = ["."]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
  "integration: end-to-end tests that exercise multiple subsystems",
  "slow: tests that take more than a second",
]

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RET", "PTH", "ASYNC"]
ignore = [
  "B008",     # FastAPI's Depends() in defaults is the framework's own idiom
  "SIM108",   # ternaries are not always clearer than an if/else
  "RET504",   # a named return value often documents what is being returned
  "B027",     # optional lifecycle hooks on an ABC are intentionally empty
  "SIM105",   # try/except/pass reads better than contextlib.suppress here
]

[tool.ruff.lint.per-file-ignores]
# The report generator is dense presentation code: table literals and style
# tuples read better as aligned rows than wrapped to 110 columns.
"scripts/generate_test_report.py" = ["E501"]
# Qt overrides are camelCase by the framework's contract, and Qt objects are
# constructed in argument position throughout.
"src/ibvap/desktop/*" = ["N802", "B008"]
# Tests import fixtures and assert on internals deliberately.
"tests/*" = ["E501", "SLF001"]

[tool.mypy]
python_version = "3.10"
packages = ["ibvap"]
mypy_path = "src"
ignore_missing_imports = true
warn_unused_ignores = false
disallow_untyped_defs = false
