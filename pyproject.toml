[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ibvap"
version = "1.0.0"
description = "IBVAP - Intelligent Border Video Analytics Platform: software-defined AI surveillance for existing CCTV infrastructure"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "IBVAP Team" }]
keywords = ["video-analytics", "surveillance", "computer-vision", "anpr", "border-security"]
classifiers = [
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Image Recognition",
  "Operating System :: POSIX :: Linux",
]

dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "opencv-python-headless>=4.9",
  "onnxruntime>=1.17",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.7",
  "pydantic-settings>=2.2",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "aiosqlite>=0.20",
  "greenlet>=3.0",
  "pyjwt>=2.8",
  "bcrypt>=4.0",
  "python-multipart>=0.0.9",
  "prometheus-client>=0.20",
  "httpx>=0.27",
  "paho-mqtt>=2.1",
  "PyYAML>=6.0",
  "structlog>=24.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pytest-cov", "ruff", "mypy", "types-PyYAML"]
export = ["torch>=2.2", "ultralytics>=8.2", "onnx>=1.16", "onnxsim"]
gpu = ["onnxruntime-gpu>=1.17"]
postgres = ["psycopg[binary]>=3.1"]

[project.scripts]
ibvap = "ibvap.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ibvap = ["ui/*.html", "ui/*.css", "ui/*.js", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
  "integration: end-to-end tests that exercise multiple subsystems",
  "slow: tests that take more than a second",
]

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RET", "PTH", "ASYNC"]
ignore = ["B008", "SIM108", "RET504"]

[tool.mypy]
python_version = "3.10"
packages = ["ibvap"]
mypy_path = "src"
ignore_missing_imports = true
warn_unused_ignores = false
disallow_untyped_defs = false
