# IBVAP — sector/central tier on Kubernetes.
#
# The edge tier is deliberately NOT deployed this way: a BOP node runs beside
# its cameras on the operational network, must survive losing its uplink, and
# gains nothing from an orchestrator that is itself on the far side of the link
# that just failed. Use Docker Compose or systemd there.
#
# This manifest suits a sector node aggregating events from many posts.

apiVersion: v1
kind: Namespace
metadata:
  name: ibvap
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ibvap-config
  namespace: ibvap
data:
  site.yaml: |
    site_id: sector-01
    site_name: Sector Control
    tier: central
    api:
      host: 0.0.0.0
      port: 8080
    storage:
      # PostgreSQL at this tier: many writers, and the data outlives any pod.
      database_url: postgresql+psycopg://ibvap@postgres:5432/ibvap
    telemetry:
      log_format: json
    cameras: []
---
apiVersion: v1
kind: Secret
metadata:
  name: ibvap-secrets
  namespace: ibvap
type: Opaque
stringData:
  # Replace before applying:  ibvap secret
  jwt-secret: "REPLACE-WITH-OUTPUT-OF-ibvap-secret"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ibvap
  namespace: ibvap
  labels: { app: ibvap }
spec:
  replicas: 2
  selector:
    matchLabels: { app: ibvap }
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata:
      labels: { app: ibvap }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: ibvap
          image: ibvap:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 8080 }
          env:
            - name: IBVAP_CONFIG
              value: /etc/ibvap/site.yaml
            - name: IBVAP_SECURITY__JWT_SECRET
              valueFrom:
                secretKeyRef: { name: ibvap-secrets, key: jwt-secret }
          volumeMounts:
            - { name: config, mountPath: /etc/ibvap, readOnly: true }
            - { name: data, mountPath: /var/lib/ibvap/data }
          resources:
            requests: { cpu: "1", memory: 2Gi }
            limits:   { cpu: "4", memory: 8Gi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          livenessProbe:
            httpGet: { path: /health/live, port: http }
            initialDelaySeconds: 30
            periodSeconds: 30
          # Readiness uses /health/ready, which reports whether the node can do
          # useful work — not merely whether the process is alive.
          readinessProbe:
            httpGet: { path: /health/ready, port: http }
            initialDelaySeconds: 20
            periodSeconds: 15
          startupProbe:
            httpGet: { path: /health/live, port: http }
            failureThreshold: 30
            periodSeconds: 5
      volumes:
        - name: config
          configMap: { name: ibvap-config }
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: ibvap
  namespace: ibvap
spec:
  selector: { app: ibvap }
  ports:
    - { name: http, port: 8080, targetPort: http }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ibvap
  namespace: ibvap
spec:
  minAvailable: 1
  selector:
    matchLabels: { app: ibvap }
