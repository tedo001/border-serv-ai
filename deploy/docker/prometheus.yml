# Scrape configuration for a BOP node.
global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    tier: edge

scrape_configs:
  - job_name: ibvap
    metrics_path: /metrics
    static_configs:
      - targets: ["node:8080"]
        labels:
          service: ibvap

rule_files:
  - /etc/prometheus/alerts.yml
