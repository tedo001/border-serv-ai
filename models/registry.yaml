# IBVAP model registry
# ====================
#
# Every model the platform runs is declared here with an explicit version, a
# SHA-256 checksum, its output layout and its class list. Nothing is inferred
# from a filename, and an artefact whose checksum does not match will not load.
#
# The entries below are the DECLARATIONS for a standard deployment. The .onnx
# artefacts themselves are not in version control — they are exported by the
# training toolchain and distributed with the site build. A node whose
# artefacts are absent falls back to classical detection and reports itself as
# degraded through /health and the operator console; it does not fail to start.
#
# To populate this registry:
#
#   ibvap models register models/detector/yolo26s-border-1.0.0.onnx \
#       --name yolo26s-border --version 1.0.0 \
#       --role detector --layout yolo26 --imgsz 640 \
#       --card docs/model-cards/yolo26s-border.md
#
# `register` writes the real checksum into this file; the values below are
# placeholders and will be replaced.
#
# Output layouts:
#   yolo26     end-to-end, NMS-free head — RECOMMENDED for new deployments
#   yolov8     v8/v9/v10/v11 transposed head (4+nc, anchors)
#   yolov5     v5/v7 head (anchors, 5+nc) with objectness
#   nms_xyxy   any export with NMS folded into the graph, (N, 6) xyxy
#   auto       inferred from tensor shape — convenience only, prefer explicit
#
# Runtimes:
#   onnx         a verified, checksummed .onnx artefact — what a post runs
#   ultralytics  a published Torch checkpoint, run directly. This is the
#                development and evaluation runtime: it downloads into
#                models/weights on first use so a fresh clone detects real
#                objects immediately, and `ibvap models fetch` exports the same
#                weights to ONNX for the field.

version: 1

models:

  # --- object detection ----------------------------------------------------

  # Published weights, so a fresh clone detects real objects on its first run
  # rather than falling back to motion. Needs the 'torch' extra; the checkpoint
  # downloads into models/weights on first use.
  #
  #   ibvap models fetch rtdetr-l     download, export ONNX, register it
  #
  rtdetr-l:
    role: detector
    description: >
      RT-DETR large on published COCO weights. End-to-end and NMS-free: the
      transformer decoder emits a fixed set of predictions, so there is no
      CPU-side suppression pass — a real saving on an edge node carrying many
      cameras on few cores. Person, vehicle and animal classes map onto the
      IBVAP taxonomy directly; the rest of COCO degrades to UNKNOWN.
    default: "coco"
    versions:
      "coco":
        file: rtdetr-l.pt
        runtime: ultralytics
        layout: rtdetr
        input_size: [640, 640]
        classes: []             # read from the checkpoint itself
        enabled: true

  yolo11s-coco:
    role: detector
    description: >
      YOLO11 small on published COCO weights — the CPU-only option for a post
      whose hardware cannot carry RT-DETR at the frame rate the site needs.
    default: "coco"
    versions:
      "coco":
        file: yolo11s.pt
        runtime: ultralytics
        layout: yolov8
        input_size: [640, 640]
        classes: []
        enabled: true

  yolo26s-border:
    role: detector
    description: >
      YOLO26-S fine-tuned for border surveillance: people, vehicles and
      livestock in fixed CCTV views, day and IR night.
      End-to-end (NMS-free), which removes the CPU-side suppression pass —
      a real saving on an edge node carrying many cameras on few cores.
    default: "1.0.0"
    versions:
      "1.0.0":
        file: detector/yolo26s-border-1.0.0.onnx
        sha256: ""              # written by `ibvap models register`
        layout: yolo26
        input_size: [640, 640]
        classes:
          - person
          - bicycle
          - motorcycle
          - car
          - bus
          - truck
          - boat
          - cow                 # mapped to the ANIMAL class; suppressible by rule
          - backpack            # mapped to BAG, for abandoned-object detection
        metrics: {}             # populated by `ibvap evaluate`
        provenance:
          family: yolo26
          end_to_end: true
        notes: >
          Recommended default. Verify accuracy against a labelled set from a
          representative site before commissioning.
        enabled: true

  yolo11s-border:
    role: detector
    description: >
      YOLO11-S alternative for hardware or runtimes where the end-to-end
      YOLO26 graph is unsupported. Standard v8-style head, so the platform
      runs its own NMS.
    default: "1.0.0"
    versions:
      "1.0.0":
        file: detector/yolo11s-border-1.0.0.onnx
        sha256: ""
        layout: yolov8
        input_size: [640, 640]
        classes: [person, bicycle, motorcycle, car, bus, truck, boat, cow, backpack]
        metrics: {}
        provenance:
          family: yolo11
          end_to_end: false
        enabled: true

  rtdetr-l-border:
    role: detector
    description: >
      RT-DETR-L, a transformer set predictor. Slower per frame than YOLO on
      CPU but markedly steadier on crowded scenes, because duplicate
      suppression is learned rather than applied by a threshold afterwards.
      Worth the cost at a check post; usually not on a 16-camera BOP node.
    default: "1.0.0"
    versions:
      "1.0.0":
        file: detector/rtdetr-l-border-1.0.0.onnx
        sha256: ""
        # RT-DETR emits NORMALISED cxcywh. Declaring this layout is what makes
        # the decoder scale them to pixels; read as YOLO output they collapse
        # into the top-left corner of every frame.
        layout: rtdetr
        input_size: [640, 640]
        classes: [person, bicycle, motorcycle, car, bus, truck, boat, cow, backpack]
        metrics: {}
        provenance:
          family: rtdetr
          end_to_end: true
        enabled: true

  # --- secondary classification --------------------------------------------
  mobilenet-imagenet:
    role: classifier
    description: >
      MobileNetV3-Large pretrained on ImageNet-1k, run over each new track's
      crop to refine the detector's coarse class. Its value here is the ~400
      animal classes: confirming "ox, not person" is what makes livestock
      suppressible on a rural fence line.

      Note it has NO person class, so the platform uses it to demote and
      reclassify only, never to promote something to PERSON.
    default: "1.0.0"
    versions:
      "1.0.0":
        file: classifier/mobilenetv3-imagenet-1.0.0.onnx
        sha256: ""
        layout: auto
        input_size: [224, 224]
        # Standard ImageNet-1k ordering. The index -> IBVAP class mapping
        # lives in ibvap.vision.classifier; only the ordering matters here.
        classes: []
        metrics: {}
        provenance:
          family: mobilenetv3
          dataset: imagenet-1k
          preprocessing: "224x224 RGB, mean/std 0.485,0.456,0.406 / 0.229,0.224,0.225"
        enabled: true

  # --- ANPR ----------------------------------------------------------------
  plate-detector:
    role: plate_detector
    description: Single-class plate localiser, run inside vehicle crops.
    default: "1.0.0"
    versions:
      "1.0.0":
        file: anpr/plate-detector-1.0.0.onnx
        sha256: ""
        layout: yolov8
        input_size: [640, 640]
        classes: [plate]
        enabled: true

  plate-ocr:
    role: plate_ocr
    description: >
      CRNN plate reader with CTC decoding. Its raw output is passed through
      the Indian number-plate grammar, which resolves the glyph/digit
      confusions that account for nearly all real ANPR errors.
    default: "1.0.0"
    versions:
      "1.0.0":
        file: anpr/plate-ocr-1.0.0.onnx
        sha256: ""
        layout: auto
        input_size: [160, 48]
        classes: []             # charset is defined in ibvap.vision.anpr
        enabled: true

  # --- face recognition ----------------------------------------------------
  face-detector:
    role: face_detector
    description: Single-class face detector, run within tracked person boxes.
    default: "1.0.0"
    versions:
      "1.0.0":
        file: face/face-detector-1.0.0.onnx
        sha256: ""
        layout: yolov8
        input_size: [640, 640]
        classes: [face]
        enabled: true

  face-embedder:
    role: face_embedder
    description: >
      ArcFace-style 512-d embedder over 112x112 aligned crops. Matching
      requires both a similarity threshold and a margin over the runner-up,
      so an ambiguous face is rejected rather than named.
    default: "1.0.0"
    versions:
      "1.0.0":
        file: face/face-embedder-1.0.0.onnx
        sha256: ""
        layout: auto
        input_size: [112, 112]
        classes: []
        enabled: true

